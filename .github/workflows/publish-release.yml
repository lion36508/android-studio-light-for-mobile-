name: Publish OxDroid APK Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New release tag, for example v0.1.1"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: true
        default: "OxDroid Mobile IDE v0.1.1"
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, verify, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Choose a new tag." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Wire Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root was not configured." >&2
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          TOOL_BIN="$RUNNER_TEMP/oxdroid-tool-bin"
          mkdir -p "$TOOL_BIN"
          for tool in aapt d8 zipalign apksigner; do
            test -x "$BUILD_TOOLS/$tool"
            ln -sf "$BUILD_TOOLS/$tool" "$TOOL_BIN/$tool"
          done
          cat > "$TOOL_BIN/ecj" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$GITHUB_WORKSPACE/assets/lib/ecj.jar" "$@"
          EOF
          chmod +x "$TOOL_BIN/ecj"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/oxdroid-release-ci.jks"
          KEYSTORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASS"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias oxdroid-ci \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=OxDroid CI,O=OxDroid,C=IN"
          {
            echo "KEYSTORE=$KEYSTORE"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: bash build.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="bin/OxDroid-Mobile-IDE.apk"
          test -s "$APK"
          unzip -t "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | head -n 8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxdroid-${{ inputs.release_tag }}-apk
          path: bin/OxDroid-Mobile-IDE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "bin/OxDroid-Mobile-IDE.apk" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            "${FLAGS[@]}"
