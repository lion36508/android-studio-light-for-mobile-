name: Publish OxDroid APK Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New release tag, for example v0.1.1"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: true
        default: "OxDroid Mobile IDE v0.1.1"
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, verify, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate release tag and require stable signing credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.OXDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OXDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OXDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OXDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Choose a new tag." >&2
            exit 1
          fi
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required stable release signing secret is missing: $name" >&2
              exit 1
            fi
          done

          echo "::add-mask::$RELEASE_KEYSTORE_BASE64"
          echo "::add-mask::$RELEASE_KEYSTORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/oxdroid-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

          {
            echo "KEYSTORE=$KEYSTORE"
            echo "KEYSTORE_PASS=$RELEASE_KEYSTORE_PASSWORD"
            echo "KEY_PASS=$RELEASE_KEY_PASSWORD"
            echo "KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Wire Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root was not configured." >&2
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"
          ANDROID_PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          if [[ ! -f "$ANDROID_PLATFORM_JAR" ]]; then
            echo "Missing Android SDK Platform 36: $ANDROID_PLATFORM_JAR" >&2
            exit 1
          fi
          TOOL_BIN="$RUNNER_TEMP/oxdroid-tool-bin"
          mkdir -p "$TOOL_BIN"
          for tool in aapt d8 zipalign apksigner; do
            test -x "$BUILD_TOOLS/$tool"
            ln -sf "$BUILD_TOOLS/$tool" "$TOOL_BIN/$tool"
          done
          cat > "$TOOL_BIN/ecj" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$GITHUB_WORKSPACE/assets/lib/ecj.jar" "$@"
          EOF
          chmod +x "$TOOL_BIN/ecj"
          {
            echo "$TOOL_BIN" >> "$GITHUB_PATH"
            echo "ANDROID_JAR=$ANDROID_PLATFORM_JAR" >> "$GITHUB_ENV"
          }

      - name: Build APK with stable release identity
        run: bash build.sh

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="bin/OxDroid-Mobile-IDE.apk"
          test -s "$APK"
          unzip -t "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | head -n 8

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oxdroid-${{ inputs.release_tag }}-apk
          path: bin/OxDroid-Mobile-IDE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "bin/OxDroid-Mobile-IDE.apk" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            "${FLAGS[@]}"
