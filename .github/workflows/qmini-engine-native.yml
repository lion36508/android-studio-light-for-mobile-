name: Q-Mini OxCore native engine

on:
  push:
    paths:
      - "engine/qmini-light/**"
      - ".github/workflows/qmini-engine-native.yml"
  pull_request:
    paths:
      - "engine/qmini-light/**"
      - ".github/workflows/qmini-engine-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable OxCore CPU library
        run: |
          cd engine/qmini-light
          bash scripts/build_oxcore.sh /tmp/libqmini_oxcore.so

      - name: Run native AddressSanitizer and UndefinedBehaviorSanitizer checks
        run: |
          cd engine/qmini-light
          bash scripts/test_oxcore_sanitizers.sh

      - name: Test native ABI and arithmetic parity
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=engine/qmini-light QMINI_OXCORE_LIBRARY=/tmp/libqmini_oxcore.so \
            pytest -q engine/qmini-light/tests/test_oxcore.py

      - name: Install AArch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Cross-compile OxCore for ARM64
        run: |
          aarch64-linux-gnu-g++ -O3 -DNDEBUG -std=c++20 -fPIC -shared \
            -Wall -Wextra -Wpedantic -Werror \
            -I engine/qmini-light/qmini_addsub/oxcore/include \
            engine/qmini-light/qmini_addsub/oxcore/src/oxcore.cpp \
            -o /tmp/libqmini_oxcore_aarch64.so
          file /tmp/libqmini_oxcore_aarch64.so
