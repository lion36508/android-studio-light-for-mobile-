name: OxDroid Code Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n

      - name: Validate Python syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import subprocess

          files = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          for name in files:
              source = pathlib.Path(name).read_text(encoding="utf-8")
              ast.parse(source, filename=name)
          print("Validated {} Python source files.".format(len(files)))
          PY

      - name: Run regression and security tests
        run: python3 -m unittest discover -s tests -v

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
