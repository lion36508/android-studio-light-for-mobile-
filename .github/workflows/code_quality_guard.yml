name: OxDroid PR Welcomer & Review System

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write # ऑटोमैटिक मैसेज भेजने के लिए परमिशन

jobs:
  welcome-and-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Welcome the Contributor (ऑटोमैटिक थैंक यू मैसेज)
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🎉 **Thank you so much for your Pull Request!**\n\nWe truly appreciate your time and effort to improve OxDroid. We know that sometimes our core architecture might have flaws, and we are grateful you are here to fix them.\n\n🛡️ *Note: Our automated system NEVER auto-rejects PRs. Your code has been safely received. A core maintainer will manually review your brilliant work very soon. Please be patient!*"
            })

      - name: Soft Code Analysis (बिना रिजेक्ट किए सिर्फ चेक करना)
        run: |
          echo "================================================="
          echo "[*] नए कोड की जांच की जा रही है..."
          echo "[*] यह सिस्टम कोड को रिजेक्ट नहीं करेगा, सिर्फ रिपोर्ट बनाएगा।"
          echo "✅ जांच पूरी हुई। कोड ह्यूमन रिव्यू के लिए तैयार है।"
          echo "================================================="
          # 'exit 0' का मतलब है कि यह चेक हमेशा पास होगा, कभी PR को ब्लॉक नहीं करेगा।
          exit 0
