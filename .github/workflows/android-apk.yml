name: Android APK build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
          # Install only the tools needed by the current Java/AAPT build pipeline.
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Wire the Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root was not configured by setup-android." >&2
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"
          ANDROID_PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          if [[ ! -f "$ANDROID_PLATFORM_JAR" ]]; then
            echo "Missing Android SDK Platform 36: $ANDROID_PLATFORM_JAR" >&2
            exit 1
          fi
          echo "ANDROID_JAR=$ANDROID_PLATFORM_JAR" >> "$GITHUB_ENV"
          TOOL_BIN="$RUNNER_TEMP/oxdroid-tool-bin"
          mkdir -p "$TOOL_BIN"

          for tool in aapt d8 zipalign apksigner; do
            if [[ ! -x "$BUILD_TOOLS/$tool" ]]; then
              echo "Missing Android build tool: $BUILD_TOOLS/$tool" >&2
              exit 1
            fi
            ln -sf "$BUILD_TOOLS/$tool" "$TOOL_BIN/$tool"
          done

          cat > "$TOOL_BIN/ecj" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$GITHUB_WORKSPACE/assets/lib/ecj.jar" "$@"
          EOF
          chmod +x "$TOOL_BIN/ecj"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"

      - name: Create temporary CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/oxdroid-ci-debug.jks"
          KEYSTORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASS"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias oxdroid-ci \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=OxDroid CI,O=OxDroid,C=IN"
          {
            echo "KEYSTORE=$KEYSTORE"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
          } >> "$GITHUB_ENV"

      - name: Verify security and regression policies
        run: python3 -m unittest discover -s tests -v

      - name: Build APK
        run: bash build.sh

      - name: Verify APK structure, alignment, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="bin/OxDroid-Mobile-IDE.apk"
          test -s "$APK"
          unzip -t "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | head -n 8

      - name: Upload debug-signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oxdroid-mobile-ide-debug-apk
          path: bin/OxDroid-Mobile-IDE.apk
          if-no-files-found: error
          retention-days: 7
