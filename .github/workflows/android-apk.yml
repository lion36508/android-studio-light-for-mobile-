name: Android APK build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
          # Install only the tools needed by the current Java/AAPT build pipeline.
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64'

      - name: Wire the Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root was not configured by setup-android." >&2
            exit 1
          fi
          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"
          ANDROID_PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          if [[ ! -f "$ANDROID_PLATFORM_JAR" ]]; then
            echo "Missing Android SDK Platform 36: $ANDROID_PLATFORM_JAR" >&2
            exit 1
          fi
          echo "ANDROID_JAR=$ANDROID_PLATFORM_JAR" >> "$GITHUB_ENV"
          TOOL_BIN="$RUNNER_TEMP/oxdroid-tool-bin"
          mkdir -p "$TOOL_BIN"

          for tool in aapt d8 zipalign apksigner; do
            if [[ ! -x "$BUILD_TOOLS/$tool" ]]; then
              echo "Missing Android build tool: $BUILD_TOOLS/$tool" >&2
              exit 1
            fi
            ln -sf "$BUILD_TOOLS/$tool" "$TOOL_BIN/$tool"
          done

          cat > "$TOOL_BIN/ecj" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$GITHUB_WORKSPACE/assets/lib/ecj.jar" "$@"
          EOF
          chmod +x "$TOOL_BIN/ecj"

          # setup-android installs the emulator package but does not guarantee
          # that its directory is on PATH for subsequent GitHub Actions steps.
          EMULATOR_BIN="$SDK_ROOT/emulator"
          if [[ ! -x "$EMULATOR_BIN/emulator" ]]; then
            echo "Missing Android emulator binary: $EMULATOR_BIN/emulator" >&2
            exit 1
          fi
          echo "$EMULATOR_BIN" >> "$GITHUB_PATH"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"

      - name: Check Android emulator hardware acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          ACCEL_LOG="$RUNNER_TEMP/oxdroid-emulator-accel.log"
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] && emulator -accel-check > "$ACCEL_LOG" 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android emulator hardware acceleration is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android 16 emulator smoke tests are skipped because this runner does not expose usable KVM hardware acceleration."
            cat "$ACCEL_LOG" 2>/dev/null || true
            {
              echo "### Android 16 device smoke test skipped"
              echo
              echo "APK compilation, archive integrity, zip alignment, and signature verification still run."
              echo "This hosted runner does not expose usable KVM hardware acceleration, so emulator install/boot/runtime checks were not run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create temporary CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/oxdroid-ci-debug.jks"
          KEYSTORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASS"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias oxdroid-ci \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=OxDroid CI,O=OxDroid,C=IN"
          {
            echo "KEYSTORE=$KEYSTORE"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
          } >> "$GITHUB_ENV"

      - name: Verify security and regression policies
        run: python3 -m unittest discover -s tests -v

      - name: Build APK
        run: bash build.sh

      - name: Verify APK structure, alignment, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="bin/OxDroid-Mobile-IDE.apk"
          test -s "$APK"
          unzip -t "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | head -n 8

      - name: Create Android 16 emulator
        if: steps.emulator_accel.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --force -n oxdroid-api36 -k "system-images;android-36;google_apis;x86_64"

      - name: Boot Android 16 emulator
        if: steps.emulator_accel.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR_LOG="$RUNNER_TEMP/oxdroid-emulator.log"
          EMULATOR_PID="$RUNNER_TEMP/oxdroid-emulator.pid"
          emulator -avd oxdroid-api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off -no-snapshot -wipe-data > "$EMULATOR_LOG" 2>&1 &
          echo $! > "$EMULATOR_PID"

          if ! timeout 300s adb wait-for-device; then
            echo "ADB did not detect the Android 16 emulator within 300 seconds." >&2
            adb devices -l || true
            tail -n 120 "$EMULATOR_LOG" || true
            exit 1
          fi

          booted=""
          boot_deadline=$((SECONDS + 300))
          while (( SECONDS < boot_deadline )); do
            booted="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$booted" == "1" ]]; then
              break
            fi
            if ! kill -0 "$(cat "$EMULATOR_PID")" 2>/dev/null; then
              echo "Android emulator process exited before boot completed." >&2
              break
            fi
            sleep 2
          done

          if [[ "$booted" != "1" ]]; then
            adb devices -l || true
            tail -n 160 "$EMULATOR_LOG" || true
            echo "Android 16 emulator did not finish booting before the 300-second deadline." >&2
            exit 1
          fi

          timeout 10s adb shell settings put global window_animation_scale 0
          timeout 10s adb shell settings put global transition_animation_scale 0
          timeout 10s adb shell settings put global animator_duration_scale 0
          timeout 10s adb shell input keyevent 82 || true

      - name: Install and smoke-test dashboard and editor
        if: steps.emulator_accel.outputs.available == 'true'
        run: python3 scripts/android_emulator_smoke.py bin/OxDroid-Mobile-IDE.apk

      - name: Upload debug-signed APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxdroid-mobile-ide-debug-apk
          path: bin/OxDroid-Mobile-IDE.apk
          if-no-files-found: error
          retention-days: 7
